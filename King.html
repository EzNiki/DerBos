<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namen-Ziehung</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#e1e4e9;
    --text:#1a1d23;
    --text-soft:#6b7280;
    --accent:#2f6fed;
    --accent-dark:#2558c4;
    --danger:#6b7280;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:520px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:28px;
  }

  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
  }
  .sub{
    font-size:13.5px;
    color:var(--text-soft);
    margin:0 0 20px;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--text-soft);
    margin-bottom:6px;
  }

  textarea{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-family:inherit;
    font-size:14px;
    line-height:1.6;
    color:var(--text);
    outline:none;
  }
  textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,111,237,0.12);
  }

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .count-box{ width:110px; }
  input[type="number"]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    color:var(--text);
    outline:none;
  }
  input[type="number"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,111,237,0.12);
  }
  .meta{
    font-size:12.5px;
    color:var(--text-soft);
  }

  .buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  button{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    padding:11px 16px;
    border-radius:8px;
    transition: filter .12s ease, transform .06s ease;
  }
  button:active{ transform:translateY(1px); }

  .btn-primary{
    flex:1;
    background:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }

  .btn-secondary{
    background:var(--bg);
    color:var(--text-soft);
    border:1px solid var(--border);
  }
  .btn-secondary:hover{ filter:brightness(0.97); }

  /* ---------- Popup ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,22,26,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
  }
  .overlay.show{ display:flex; }

  .popup{
    background:#fff;
    border-radius:14px;
    padding:36px 32px 28px;
    max-width:400px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    animation: pop .22s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{
    0%{ opacity:0; transform:scale(.9) translateY(6px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }

  .popup .label{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }
  .popup .winner{
    font-size:28px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 22px;
    word-break:break-word;
  }
  .popup ol{
    text-align:left;
    margin:0 0 22px;
    padding-left:20px;
    font-size:15px;
    line-height:1.8;
    max-height:220px;
    overflow-y:auto;
  }
  .popup .close-btn{
    background:var(--accent);
    color:#fff;
    padding:10px 22px;
    border-radius:8px;
  }
  .popup .close-btn:hover{ filter:brightness(1.06); }

  /* ---------- Fake-Modus ---------- */
  .fake-box{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .fake-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:500;
    color:var(--text-soft);
    cursor:pointer;
  }
  .fake-toggle input{ cursor:pointer; }
  .fake-target-row{
    display:none;
    margin-top:10px;
  }
  .fake-target-row.show{ display:block; }
  .fake-target-row label{
    font-size:12.5px;
    color:var(--text-soft);
    margin-bottom:6px;
  }
  .fake-target-row input[type="text"]{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    outline:none;
  }
  .fake-target-row input[type="text"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,111,237,0.12);
  }

  .fake-badge{
    display:inline-block;
    background:#fff1d6;
    color:#9a6400;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Namen-Ziehung</h1>
  <p class="sub">Namen eintragen und einen (oder mehrere) zufällig auswählen lassen.</p>

  <label for="names">Namen — eine pro Zeile</label>
  <textarea id="names" placeholder="Anna
Ben
Carla
David
..."></textarea>

  <div class="row">
    <div class="count-box">
      <label for="count">Anzahl</label>
      <input type="number" id="count" value="1" min="1" max="1000">
    </div>
    <div class="meta" id="meta">0 Namen</div>
  </div>

  <div class="buttons">
    <button class="btn-primary" id="drawBtn">Namen ziehen</button>
    <button class="btn-secondary" id="clearBtn">Leeren</button>
  </div>

  <div class="fake-box" id="fakeBox">
    <label class="fake-toggle">
      <input type="checkbox" id="fakeToggle">
      <span>🎭 Fake-Modus (Ergebnis wird sichtbar manipuliert)</span>
    </label>
    <div class="fake-target-row" id="fakeTargetRow">
      <label for="fakeTarget">Name, der immer gewinnt (min. 5 Namen in der Liste nötig)</label>
      <input type="text" id="fakeTarget" placeholder="z.B. Max">
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="label" id="popupLabel">Gewonnen hat</div>
    <div id="popupBody"></div>
    <button class="close-btn" id="closeBtn">Schließen</button>
  </div>
</div>

<script>
  const namesEl = document.getElementById('names');
  const countEl = document.getElementById('count');
  const metaEl = document.getElementById('meta');
  const drawBtn = document.getElementById('drawBtn');
  const clearBtn = document.getElementById('clearBtn');
  const overlay = document.getElementById('overlay');
  const popupLabel = document.getElementById('popupLabel');
  const popupBody = document.getElementById('popupBody');
  const closeBtn = document.getElementById('closeBtn');
  const fakeToggle = document.getElementById('fakeToggle');
  const fakeTargetRow = document.getElementById('fakeTargetRow');
  const fakeTargetInput = document.getElementById('fakeTarget');

  fakeToggle.addEventListener('change', () => {
    fakeTargetRow.classList.toggle('show', fakeToggle.checked);
  });

  function getNames(){
    return namesEl.value
      .split('\n')
      .map(n => n.trim())
      .filter(n => n.length > 0);
  }

  function updateMeta(){
    const n = getNames().length;
    metaEl.textContent = n + (n === 1 ? ' Name' : ' Namen');
    countEl.max = Math.max(n, 1);
  }
  namesEl.addEventListener('input', updateMeta);
  updateMeta();

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      const j = buf[0] % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  drawBtn.addEventListener('click', () => {
    const names = getNames();
    if(names.length === 0){
      namesEl.focus();
      return;
    }
    let count = parseInt(countEl.value, 10) || 1;
    count = Math.max(1, Math.min(count, names.length, 1000));

    const fakeActive = fakeToggle.checked && names.length >= 5 &&
      names.some(n => n.toLowerCase() === fakeTargetInput.value.trim().toLowerCase()) &&
      fakeTargetInput.value.trim() !== '';

    let picked;
    let badge = '';

    if(fakeActive && count === 1){
      const target = names.find(n => n.toLowerCase() === fakeTargetInput.value.trim().toLowerCase());
      picked = [target];
      badge = '<div class="fake-badge">🎭 Manipuliert — kein echter Zufall</div>';
    } else {
      picked = shuffle(names).slice(0, count);
    }

    if(count === 1){
      popupLabel.textContent = 'Gewonnen hat';
      popupBody.innerHTML = badge + '<div class="winner">' + escapeHtml(picked[0]) + '</div>';
    } else {
      popupLabel.textContent = count + ' ausgewählt';
      popupBody.innerHTML = '<ol>' + picked.map(n => '<li>' + escapeHtml(n) + '</li>').join('') + '</ol>';
    }

    overlay.classList.add('show');
  });

  clearBtn.addEventListener('click', () => {
    namesEl.value = '';
    updateMeta();
  });

  closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.classList.remove('show');
  });
</script>

</body>
</html>
